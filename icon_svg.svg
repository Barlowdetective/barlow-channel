<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1b3e"/>
      <stop offset="50%" style="stop-color:#0f2460"/>
      <stop offset="100%" style="stop-color:#1a0a3c"/>
    </linearGradient>
    <linearGradient id="bGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7c88ff"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#38bdf8"/>
      <stop offset="100%" style="stop-color:#818cf8"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#34d399"/>
    </linearGradient>
    <clipPath id="iconClip">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
  </defs>

  <g clip-path="url(#iconClip)">
    <!-- Background -->
    <rect width="512" height="512" fill="url(#bgGrad)"/>

    <!-- Subtle grid -->
    <line x1="0" y1="128" x2="512" y2="128" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <line x1="128" y1="0" x2="128" y2="512" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="rgba(255,255,255,0.03)" stroke-width="1"/>

    <!-- Glow behind B -->
    <ellipse cx="234" cy="264" rx="128" ry="120" fill="rgba(99,102,241,0.12)"/>

    <!-- B lettermark - left vertical stroke -->
    <rect x="126" y="142" width="47" height="228" rx="8" fill="url(#bGrad)"/>
    <!-- B - top bump -->
    <path d="M165 142 Q256 142 256 190 Q256 238 165 238 L165 142Z" fill="url(#bGrad)"/>
    <!-- B - bottom bump -->
    <path d="M165 238 Q276 238 276 288 Q276 340 165 340 L165 238Z" fill="url(#bGrad)"/>
    <!-- Inner cutouts -->
    <rect x="175" y="153" width="65" height="75" rx="30" fill="url(#bgGrad)" opacity="0.95"/>
    <rect x="175" y="249" width="83" height="81" rx="34" fill="url(#bgGrad)" opacity="0.95"/>

    <!-- Broadcast arcs -->
    <path d="M 322 178 A 47 47 0 0 1 322 278" fill="none" stroke="url(#arcGrad)" stroke-width="14" stroke-linecap="round" opacity="0.9"/>
    <path d="M 348 152 A 84 84 0 0 1 348 304" fill="none" stroke="url(#arcGrad)" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
    <path d="M 376 126 A 121 121 0 0 1 376 330" fill="none" stroke="url(#arcGrad)" stroke-width="7" stroke-linecap="round" opacity="0.35"/>

    <!-- Live dot -->
    <circle cx="318" cy="228" r="9" fill="#ef4444"/>
    <circle cx="318" cy="228" r="5" fill="#fca5a5"/>

    <!-- Ticker lines -->
    <rect x="126" y="388" width="150" height="9" rx="4" fill="url(#lineGrad)" opacity="0.85"/>
    <rect x="126" y="405" width="106" height="8" rx="4" fill="rgba(99,102,241,0.6)"/>
    <rect x="126" y="420" width="76" height="6" rx="3" fill="rgba(56,189,248,0.4)"/>

    <!-- Border -->
    <rect x="0" y="0" width="512" height="512" rx="112" fill="none" stroke="rgba(255,255,255,0.07)" stroke-width="2"/>
  </g>
</svg>
